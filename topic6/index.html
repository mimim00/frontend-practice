<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>校园自习室看板</title>
  <link href="../libs/bootstrap.min.css" rel="stylesheet">
  <style>
    .chart-box { height: 360px; }
    #status { display: none; }
    #building-filters .btn.active { background-color: #1f4f7d; color: #fff; border-color: #1f4f7d; }
  </style>
</head>
<body class="container py-4">
  <header class="mb-3">
    <h1 class="h3">校园自习室看板</h1>
    <p class="text-muted" id="sub-title">数据来源：课程统一数据集</p>
  </header>

  <p id="status" class="alert alert-warning"></p>

  <section class="row g-3 mb-4" id="cards"></section>

  <section class="row g-3 mb-4">
    <div class="col-lg-6">
      <h2 class="h5">各楼栋座位与占用（ECharts 柱状图）</h2>
      <div id="building-chart" class="chart-box"></div>
    </div>
    <div class="col-lg-6">
      <h2 class="h5">开放状态占比（Chart.js 圆环图）</h2>
      <div class="chart-box"><canvas id="status-chart"></canvas></div>
    </div>
  </section>

  <section>
    <h2 class="h5">自习室列表</h2>
    <div id="building-filters" class="btn-group mb-3" role="group"></div>
    <div class="table-responsive">
      <table class="table table-hover align-middle" id="room-table">
        <thead>
          <tr>
            <th>名称</th><th>楼栋</th><th>楼层</th><th>座位</th><th>已占用</th><th>空位</th><th>状态</th><th>开放时间</th>
          </tr>
        </thead>
        <tbody id="room-body"></tbody>
      </table>
    </div>
  </section>

  <script src="../libs/jquery-3.7.1.min.js"></script>
  <script src="../libs/bootstrap.bundle.min.js"></script>
  <script src="../libs/echarts.min.js"></script>
  <script src="../libs/chart.umd.js"></script>
  <script src="app.js"></script>
</body>
</html>
