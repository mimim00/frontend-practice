<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>星球宇宙 · 自主实践主题三维场景</title>
<style>
  /* body 默认 8px 外边距，不清掉画布铺不满 */
  body { margin: 0; overflow: hidden; background: #04060f; font-family: "Microsoft YaHei", sans-serif; }

  #hud {
    position: fixed; left: 14px; top: 12px; z-index: 5; color: #cfd8dc;
    background: rgba(6, 12, 24, .68); border: 1px solid #1d3552;
    border-radius: 10px; padding: 10px 14px; font-size: 13px; line-height: 1.9;
    pointer-events: none;
  }
  #hud h1 { margin: 0 0 4px; font-size: 15px; color: #4fc3f7; }
  #hud b { color: #ffe082; }
  #hud .dim { color: #8296a8; font-size: 12px; }

  #fps-box {
    position: fixed; right: 14px; top: 12px; z-index: 5; color: #8bc34a;
    background: rgba(6, 12, 24, .68); border: 1px solid #1d3552; border-radius: 10px;
    padding: 8px 12px; font: 13px/1.5 Consolas, monospace;
  }

  #info {
    position: fixed; right: 14px; bottom: 62px; z-index: 5; width: 250px;
    background: rgba(6, 12, 24, .86); border: 1px solid #2e5f8a; border-radius: 10px;
    padding: 12px 14px; color: #e3f2fd; font-size: 13px; line-height: 1.8;
    opacity: 0; transform: translateY(8px); transition: .25s; pointer-events: none;
  }
  #info.show { opacity: 1; transform: translateY(0); }
  #info b { color: #ffd54f; font-size: 15px; }
  #info .fact { color: #90caf9; }

  #btns { position: fixed; right: 14px; bottom: 14px; z-index: 6; }
  #btns button {
    background: #12263f; color: #cfe4f7; border: 1px solid #2e5f8a;
    border-radius: 8px; padding: 7px 14px; margin-left: 8px; cursor: pointer; font-size: 13px;
  }
  #btns button:hover { background: #1b3a5c; }
</style>
</head>
<body>


<div id="fps-box">FPS <span id="fps">--</span></div>

<div id="info"></div>
<div id="btns">
  <button type="button" id="btn-pause">暂停公转</button>
  <button type="button" id="btn-reset">重置视角</button>
</div>

<!-- my-scene 是 three-d 的子目录，库在仓库根目录，所以路径是 ../../libs/ -->
<script src="../../libs/three.min.js"></script>
<script src="../../libs/OrbitControls.js"></script>
<script src="app.js"></script>
</body>
</html>
