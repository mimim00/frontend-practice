<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>班主任学生信息采集表</title>
    <link rel="stylesheet" href="css2/style.css">
</head>
<body>
<header>
    <h1>班级学生信息采集登记表</h1>
    <p>班主任信息收集，请全体同学如实填写，带*为必填项</p>
</header>

<nav>
    <a href="#base">基础信息</a>
    <a href="#live">住宿情况</a>
    <a href="#contact">紧急联系</a>
</nav>

<main>
    <section id="base">
        <h2>学生个人信息填报</h2>
        <!-- 任务3 details+summary 折叠填写说明 -->
        <details open>
            <summary>填写说明（点击收起/展开）</summary>
            <p>本表单由班主任收集班级档案使用；手机号、家长信息仅用于校内联系，严格保密。</p>
        </details>

        <form action="#" method="post">
            <!-- 任务2 fieldset + legend 表单分组 -->
            <fieldset>
                <legend>学生基础身份信息</legend>
                <div class="item">
                    <label for="username">学生姓名 *</label>
                    <input type="text" id="username" name="username" required maxlength="10">
                </div>
                <div class="item">
                    <label for="stuId">学号 *</label>
                    <input type="text" id="stuId" name="stuId" required pattern="^[0-9]{10}$" placeholder="10位数字学号">
                </div>
                <div class="item">
                    <label for="email">学生邮箱 *</label>
                    <input type="email" id="email" name="email" required>
                </div>
                <div class="item">
                    <label for="phone">本人手机号 *</label>
                    <input type="text" id="phone" name="phone" required pattern="^1[3-9]\d{9}$">
                </div>
                <div class="item">
                    <label>性别</label>
                    <div>
                        <label><input type="radio" name="gender" value="male">男</label>
                        <label><input type="radio" name="gender" value="female">女</label>
                    </div>
                </div>
                <div class="item">
                    <label for="birth">出生日期</label>
                    <input type="date" id="birth" name="birth">
                </div>
            </fieldset>

            <fieldset id="live">
                <legend>住宿与在校情况</legend>
                <div class="item">
                    <label for="dorm">住宿类型 *</label>
                    <select id="dorm" name="dorm" required>
                        <option value="">请选择住宿类型</option>
                        <option value="school">校内宿舍</option>
                        <option value="home">走读居家</option>
                        <option value="rent">校外租房</option>
                    </select>
                </div>
               
            </fieldset>

            <fieldset id="contact">
                <legend>家庭特殊情况与补充</legend>
                <div class="item">
                    <label for="familyDesc">家庭情况简要备注 *</label>
                    <textarea id="familyDesc" name="familyDesc" required maxlength="200"></textarea>
                </div>
                <div class="item">
                    <label for="queryPwd">其他情况*</label>
                    <input type="password" id="queryPwd" name="queryPwd" required minlength="6" maxlength="16">
                </div>
            </fieldset>

            <div class="btns">
                <button type="submit">提交信息</button>
                <button type="reset">重置表单</button>
            </div>
        </form>
    </section>
</main>

<footer>
    <p>©2026 班级班主任信息收集 · 课程实践作业</p>
</footer>
</body>
</html>
