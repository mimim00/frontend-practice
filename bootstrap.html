<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap课程展示</title>
    <!-- Bootstrap5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- 自定义样式写在bootstrap之后，用于覆盖 -->
    <style>
        .card .card-title {
            color: #0b5ed7;
        }
    </style>
</head>
<body>
<div class="container">
    <!-- Bootstrap导航栏 -->
    <nav class="navbar navbar-expand-md bg-body-tertiary mb-4">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">前端课程墙</a>
            <div class="navbar-collapse">
                <div class="nav">
                    <a class="nav-link active" href="#">全部课程</a>
                    <a class="nav-link" href="#">关于</a>
                </div>
            </div>
        </div>
    </nav>

    <h2>全部课程</h2>
    <!-- Bootstrap栅格 row + col 12栅格系统 -->
    <div class="row g-3">
        <div class="col-md-6 col-lg-4">
            <div class="card h-100">
                <div class="card-body">
                    <h5 class="card-title">HTML入门</h5>
                    <p class="card-text">结构与语义，页面一切的起点。</p>
                    <a href="#" class="btn btn-primary">查看详情</a>
                </div>
            </div>
        </div>
        <div class="col-md-6 col-lg-4">
            <div class="card h-100">
                <div class="card-body">
                    <h5 class="card-title">CSS布局</h5>
                    <p class="card-text">Flex、Grid与响应式设计。</p>
                    <a href="#" class="btn btn-primary">查看详情</a>
                </div>
            </div>
        </div>
        <div class="col-md-6 col-lg-4">
            <div class="card h-100">
                <div class="card-body">
                    <h5 class="card-title">JavaScript基础</h5>
                    <p class="card-text">让页面动起来的第一门语言。</p>
                    <a href="#" class="btn btn-primary">查看详情</a>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Bootstrap JS bundle，交互组件必须引入 -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
