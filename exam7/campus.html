<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>校园角标 · A-Frame 主题小场景</title>
<!-- 引入方式：课程离线包；campus.html 在 three-d/ 下，所以库路径要写 ../libs/ -->
<script src="../libs/aframe.min.js"></script>
<style>
  body { margin: 0; }
  #tip {
    position: fixed; left: 14px; top: 12px; z-index: 9; color: #fff;
    font: 13px/1.8 "Microsoft YaHei", sans-serif;
    background: rgba(0, 0, 0, .42); border-radius: 8px; padding: 8px 12px;
  }
  #tip b { color: #ffe082; }
</style>
</head>
<body>
<div id="tip">
  <b>校园角标 · 声明式三维场景</b><br>
  WASD 走进场景环顾，鼠标拖动转向；把准星对齐<b>草坪上的雕塑</b>约 1 秒（或直接点击）→ 雕塑变色
</div>

<a-scene>
  <!-- ===================== 环境 ===================== -->
  <a-sky color="#aee3f7"></a-sky>
  <!-- 地面开到 60×60 并往前挪：远边缘落到地平线附近，才不会露出一块"悬空的草地" -->
  <a-plane position="0 0 -10" rotation="-90 0 0" width="60" height="60" color="#7cb342"></a-plane>

  <!-- ===================== 主体：教学楼（方盒 + 屋顶） ===================== -->
  <a-box position="0 1.2 -6" width="4" height="2.4" depth="2" color="#efeeee"></a-box>
  <a-box position="0 2.7 -6" width="4.4" height="0.4" depth="2.4" color="#b71c1c"></a-box>
  <!-- 门与窗（用薄盒子贴面，不用贴图，避免版权风险） -->
  <a-box position="0 0.5 -4.99" width="0.8" height="1" depth="0.06" color="#5d4037"></a-box>
  <a-box position="-1.2 1.5 -4.99" width="0.6" height="0.6" depth="0.06" color="#90caf9"></a-box>
  <a-box position="1.2 1.5 -4.99" width="0.6" height="0.6" depth="0.06" color="#90caf9"></a-box>

  <!-- ===================== 旗杆与旗帜（旗帜带飘扬动画） ===================== -->
  <a-cylinder position="3 1.8 -5" radius="0.05" height="3.6" color="#9e9e9e"></a-cylinder>
  <a-box position="3.35 3.3 -5" width="0.7" height="0.45" depth="0.03" color="#e53935"
         animation="property: position; to: 3.4 3.3 -5; dir: alternate; dur: 900; loop: true">
  </a-box>

  <!-- ===================== 路灯：杆 + 发光球（点光源） ===================== -->
  <a-cylinder position="-3 1.2 -4" radius="0.06" height="2.4" color="#616161"></a-cylinder>
  <a-sphere position="-3 2.5 -4" radius="0.18" color="#fff59d"
            animation="property: scale; to: 1.3 1.3 1.3; dir: alternate; dur: 1200; loop: true">
  </a-sphere>
  <a-light type="point" position="-3 2.6 -4" color="#fff59d" intensity="0.6"></a-light>

  <!-- ===================== 【我加的】课后练习 2：点击变色的雕塑 ===================== -->
  <!-- cursor 是"准星"，注视即瞄准；非 VR 环境下鼠标点击也能触发 onclick -->
  <!-- raycaster.objects 白名单：不写的话 A-Frame 会对场景里所有实体逐个求交，
       控制台会提示 "For performance, please define raycaster.objects"。
       给可点击实体加 data-raycastable，再在 cursor 上限定 raycaster="objects: [data-raycastable]"，
       射线就只测这几个实体。这正是研究任务二要查的 cursor / raycaster 组件配置。 -->
  <a-cylinder position="-1.4 0.5 -2.6" radius="0.5" height="1" color="#cfd8dc"
              material="metalness: 0.4; roughness: 0.35"></a-cylinder>
  <a-sphere position="-1.4 1.35 -2.6" radius="0.42" color="#8d6e63" data-raycastable
            onclick="this.setAttribute('color', '#ffd54f')"
            animation__spin="property: rotation; to: 0 360 0; dur: 10000; loop: true; easing: linear">
  </a-sphere>

  <!-- ===================== 【我加的】几棵树，让场景不空 ===================== -->
  <a-cylinder position="-5 0.6 -7" radius="0.22" height="1.2" color="#6d4c41"></a-cylinder>
  <a-sphere position="-5 1.7 -7" radius="0.9" color="#2e7d32"></a-sphere>
  <a-cylinder position="5 0.6 -7.5" radius="0.22" height="1.2" color="#6d4c41"></a-cylinder>
  <a-sphere position="5 1.7 -7.5" radius="0.9" color="#33691e"></a-sphere>

  <!-- ===================== 光源 ===================== -->
  <a-light type="ambient" color="#ffffff" intensity="0.7"></a-light>
  <a-light type="directional" color="#fff8e1" intensity="0.5" position="3 6 2"></a-light>

  <!-- ===================== 相机初始位：稍远处平视校园 ===================== -->
  <a-camera position="0 1.8 2">
    <a-cursor color="#ffffff" fuse="true" fuse-timeout="1000"
              raycaster="objects: [data-raycastable]; far: 30"></a-cursor>
  </a-camera>
</a-scene>
</body>
</html>
